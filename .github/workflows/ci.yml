name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      nix: ${{ steps.nix.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Quoted, because GitHub treats a bare 0 as falsy and the fallback branch wins.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - id: nix
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ -n "$BASE_REF" ]]; then
            files=$(git diff --name-only "origin/$BASE_REF...HEAD")
          else
            files=$(git ls-files)
          fi
          if grep -qE '^(nix/|scripts/|flake\.(nix|lock)$|\.github/workflows/)' <<<"$files"; then
            echo "changed=true" >>"$GITHUB_OUTPUT"
          else
            echo "changed=false" >>"$GITHUB_OUTPUT"
          fi

  flake-check:
    name: nix flake check
    needs: changes
    if: needs.changes.outputs.nix == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - name: nix flake check
        run: nix flake check

  # A skipped matrix job reports as the bare job name, so per-job required checks hang.
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    needs: [changes, flake-check]
    if: always()
    permissions: {}
    steps:
      - name: Fail unless every needed job succeeded or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failures=$(jq -r 'to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | .key' <<<"$NEEDS")
          if [[ -n "$failures" ]]; then
            echo "::error::not succeeded or skipped: ${failures//$'\n'/, }"
            exit 1
          fi
          echo "every needed job succeeded or was skipped"
