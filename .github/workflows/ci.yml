name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Nightly, because merges made with GITHUB_TOKEN skip push workflows and would let main's cache go cold.
    - cron: "47 3 * * *"

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      nix: ${{ steps.nix.outputs.changed }}
      lock: ${{ steps.nix.outputs.lock }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Quoted, because GitHub treats a bare 0 as falsy and the fallback branch wins.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - id: nix
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ -n "$BASE_REF" ]]; then
            files=$(git diff --name-only "origin/$BASE_REF...HEAD")
          else
            files=$(git ls-files)
          fi
          if grep -qE '^(nix/|scripts/|flake\.(nix|lock)$|\.github/workflows/)' <<<"$files"; then
            echo "changed=true" >>"$GITHUB_OUTPUT"
          else
            echo "changed=false" >>"$GITHUB_OUTPUT"
          fi
          if grep -qxF 'flake.lock' <<<"$files"; then
            echo "lock=true" >>"$GITHUB_OUTPUT"
          else
            echo "lock=false" >>"$GITHUB_OUTPUT"
          fi

  flake-check:
    name: nix flake check
    needs: changes
    if: needs.changes.outputs.nix == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - name: nix flake check
        run: nix flake check

  # push and nightly runs always build to keep main's cache warm; PRs build only when the Nix area changed.
  ci-builds:
    name: nix build ciBuilds
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.nix == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - name: nix build ciBuilds
        run: nix build .#ciBuilds --no-link --print-build-logs

  hosts:
    name: List NixOS hosts
    needs: changes
    # push and nightly runs count every file as changed, so the event gate keeps them out of the slow build.
    if: needs.changes.outputs.lock == 'true' && github.event_name != 'push' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      hosts: ${{ steps.list.outputs.hosts }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - id: list
        run: echo "hosts=$(nix eval --json .#nixosConfigurations --apply builtins.attrNames)" >>"$GITHUB_OUTPUT"

  # No magic-nix-cache: a full toplevel closure overflows the 10 GB Actions cache and would evict the risky-derivation cache.
  host-toplevel:
    name: build ${{ matrix.host }}
    needs: hosts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      # Build every host even after one fails, so the run reports each host's status.
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.hosts.outputs.hosts) }}
    steps:
      - uses: actions/checkout@v7
      - uses: jlumbroso/free-disk-space@v2
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: build toplevel
        run: nix build --no-link --print-build-logs ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel"

  # A skipped matrix job reports as the bare job name, so per-job required checks hang.
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    needs: [changes, flake-check, ci-builds, hosts, host-toplevel]
    if: always()
    permissions: {}
    steps:
      - name: Fail unless every needed job succeeded or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failures=$(jq -r 'to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | .key' <<<"$NEEDS")
          if [[ -n "$failures" ]]; then
            echo "::error::not succeeded or skipped: ${failures//$'\n'/, }"
            exit 1
          fi
          echo "every needed job succeeded or was skipped"
