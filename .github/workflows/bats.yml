name: bats
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - name: bats suite
        run: nix build .#checks."$(nix eval --raw --impure --expr builtins.currentSystem)".worktree-scripts
