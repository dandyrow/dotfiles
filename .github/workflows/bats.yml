name: bats

# No paths filter. The check this runs is bats, which costs seconds, and a filter
# here is exactly how the suite went unverified twice: #242 added it under
# scripts/ and the workflow only triggers on nix/**, so the suite was never run,
# and #248 and #249 could not be checked for the same reason. A cheap check with
# no filter cannot be skipped by a path someone forgot to update.
#
# The full flake check keeps its filter in ci.yml, where waiting is worth avoiding.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      # scripts/ is a flake input only through this check, so it is the whole of
      # what a change there can break. No nixpkgs to build, so no flake check.
      - name: bats suite
        run: nix build .#checks.$(nix eval --raw --impure --expr builtins.currentSystem).worktree-scripts
