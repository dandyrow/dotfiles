version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "⬆️ chore(actions)"
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "⬆️ chore(nix)"
    groups:
      flake-inputs:
        patterns: ["*"]
