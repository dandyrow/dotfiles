# Generated config — herdr reads this from ~/.config/herdr/config.toml

onboarding = false

[theme]
name = "catppuccin"

[theme.custom]
# Tabs share the bar's panel background so only text marks each tab, like tmux.
tab_active_bg = "#181825"
tab_active_fg = "#89b4fa"
tab_inactive_bg = "#181825"
tab_inactive_fg = "#a6adc8"
tab_bar_status_fg = "#b4befe"

[ui]
tab_bar_position = "top"
tab_bar_right = [
  { type = "hostname" },
  { type = "text", text = "🌐" },
  { type = "datetime", format = "%a %Y-%m-%d  %R" },
]
tab_bar_right_separator = " "
