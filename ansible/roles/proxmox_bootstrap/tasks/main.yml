---
- name: Create dedicated OpenTofu PVE user
  ansible.builtin.command: pveum user add {{ proxmox_bootstrap_user }}
  register: proxmox_bootstrap_user_add
  changed_when: "'already exists' not in proxmox_bootstrap_user_add.stderr"
  failed_when: proxmox_bootstrap_user_add.rc != 0 and 'already exists' not in proxmox_bootstrap_user_add.stderr

- name: Create scoped Terraform role
  ansible.builtin.command: pveum role add {{ proxmox_bootstrap_role }} -privs "{{ proxmox_bootstrap_role_privs }}"
  register: proxmox_bootstrap_role_add
  changed_when: "'already exists' not in proxmox_bootstrap_role_add.stderr"
  failed_when: proxmox_bootstrap_role_add.rc != 0 and 'already exists' not in proxmox_bootstrap_role_add.stderr

- name: Bind Terraform role to user on datacenter root
  ansible.builtin.command: pveum aclmod / -user {{ proxmox_bootstrap_user }} -role {{ proxmox_bootstrap_role }}
  changed_when: false

- name: Check for existing provider token
  ansible.builtin.command:
    pveum user token list {{ proxmox_bootstrap_user }} --output-format json
  changed_when: false
  register: proxmox_bootstrap_token_list

- name: Remove provider token to force a fresh secret
  ansible.builtin.command:
    pveum user token remove {{ proxmox_bootstrap_user }} {{ proxmox_bootstrap_token }}
  when: proxmox_bootstrap_regenerate_token and proxmox_bootstrap_token in proxmox_bootstrap_token_list.stdout
  changed_when: false

- name: Create provider API token
  ansible.builtin.command:
    pveum user token add {{ proxmox_bootstrap_user }} {{ proxmox_bootstrap_token }} --privsep 0 --output-format json
  when: proxmox_bootstrap_regenerate_token or proxmox_bootstrap_token not in proxmox_bootstrap_token_list.stdout
  register: proxmox_bootstrap_token_add
  changed_when: true

- name: Show newly-created token secret (capture into your secret manager now)
  ansible.builtin.debug:
    msg: "{{ proxmox_bootstrap_token_add.stdout }}"
  when: proxmox_bootstrap_token_add is defined and proxmox_bootstrap_token_add.changed

- name: Verify effective permissions
  ansible.builtin.command: pveum user permissions {{ proxmox_bootstrap_user }}
  changed_when: false
