---
- name: Create scoped Terraform role
  community.proxmox.proxmox_role:
    api_host: "{{ lookup('ansible.builtin.env', 'PROXMOX_HOST') }}"
    api_user: "{{ lookup('ansible.builtin.env', 'PROXMOX_USER') }}"
    api_password: "{{ lookup('ansible.builtin.env', 'PROXMOX_PASSWORD') }}"
    roleid: "{{ proxmox_bootstrap_role }}"
    privs: "{{ proxmox_bootstrap_role_privs | split() }}"

- name: Drop provider token so regenerate can mint a fresh secret
  community.proxmox.proxmox_user:
    api_host: "{{ lookup('ansible.builtin.env', 'PROXMOX_HOST') }}"
    api_user: "{{ lookup('ansible.builtin.env', 'PROXMOX_USER') }}"
    api_password: "{{ lookup('ansible.builtin.env', 'PROXMOX_PASSWORD') }}"
    userid: "{{ proxmox_bootstrap_user }}"
    tokens: []
  when: proxmox_bootstrap_regenerate_token

- name: Create dedicated OpenTofu PVE user with provider token
  community.proxmox.proxmox_user:
    api_host: "{{ lookup('ansible.builtin.env', 'PROXMOX_HOST') }}"
    api_user: "{{ lookup('ansible.builtin.env', 'PROXMOX_USER') }}"
    api_password: "{{ lookup('ansible.builtin.env', 'PROXMOX_PASSWORD') }}"
    userid: "{{ proxmox_bootstrap_user }}"
    tokens:
      - tokenid: "{{ proxmox_bootstrap_token }}"
        privsep: false
        comment: OpenTofu provider token for New-H0Ryzen deploy
  register: proxmox_bootstrap_user_result

- name: Bind Terraform role to user on datacenter root
  community.proxmox.proxmox_access_acl:
    api_host: "{{ lookup('ansible.builtin.env', 'PROXMOX_HOST') }}"
    api_user: "{{ lookup('ansible.builtin.env', 'PROXMOX_USER') }}"
    api_password: "{{ lookup('ansible.builtin.env', 'PROXMOX_PASSWORD') }}"
    path: /
    roleid: "{{ proxmox_bootstrap_role }}"
    type: user
    ugid: "{{ proxmox_bootstrap_user }}"

- name: Read current secrets for the BWS homelab project
  ansible.builtin.command:
    cmd: bws secret list --project "{{ lookup('ansible.builtin.env', 'BWS_PROJECT_ID') }}"
  environment:
    BWS_ACCESS_TOKEN: "{{ lookup('ansible.builtin.env', 'BWS_ACCESS_TOKEN') }}"
  changed_when: false
  no_log: true
  register: proxmox_bootstrap_bws_list
  when: proxmox_bootstrap_user_result.secrets | default({}) | length > 0

- name: Resolve the stored secret id for the Proxmox token
  ansible.builtin.set_fact:
    proxmox_bootstrap_bws_secret_id: >-
      {{ (proxmox_bootstrap_bws_list.stdout | from_json
         | selectattr('key', 'equalto', proxmox_bootstrap_bws_secret_key) | list
         | map(attribute='id') | first) | default('', true) }}
  when: proxmox_bootstrap_user_result.secrets | default({}) | length > 0

- name: Create the Proxmox token secret in BWS
  ansible.builtin.command:
    cmd: bws secret create "{{ proxmox_bootstrap_bws_secret_key }}" "{{ proxmox_bootstrap_user_result.secrets[proxmox_bootstrap_token] }}" --project "{{ lookup('ansible.builtin.env', 'BWS_PROJECT_ID') }}"
  environment:
    BWS_ACCESS_TOKEN: "{{ lookup('ansible.builtin.env', 'BWS_ACCESS_TOKEN') }}"
  no_log: true
  when: proxmox_bootstrap_user_result.secrets | default({}) | length > 0 and proxmox_bootstrap_bws_secret_id == ''

- name: Update the stored Proxmox token secret in BWS
  ansible.builtin.command:
    cmd: bws secret edit "{{ proxmox_bootstrap_bws_secret_id }}" "{{ proxmox_bootstrap_user_result.secrets[proxmox_bootstrap_token] }}"
  environment:
    BWS_ACCESS_TOKEN: "{{ lookup('ansible.builtin.env', 'BWS_ACCESS_TOKEN') }}"
  no_log: true
  when: proxmox_bootstrap_user_result.secrets | default({}) | length > 0 and proxmox_bootstrap_bws_secret_id != ''
