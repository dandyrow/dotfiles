---
proxmox_bootstrap_user: terraform@pve
proxmox_bootstrap_role: Terraform
proxmox_bootstrap_token: provider
proxmox_bootstrap_regenerate_token: false
# Controller-only; install flows stage only etc/, never this.
proxmox_bootstrap_secret_file: >-
  {{ playbook_dir }}/../secrets/proxmox/provider-token
# Scoped to New-H0Ryzen; User.Modify omitted to block self-privilege-escalation.
# VM.Monitor dropped in PVE 9.0; the provider never needs it.
proxmox_bootstrap_role_privs: >-
  VM.Allocate VM.Audit VM.Clone VM.Config.CDROM VM.Config.Cloudinit
  VM.Config.CPU VM.Config.Disk VM.Config.HWType VM.Config.Memory
  VM.Config.Network VM.Config.Options VM.PowerMgmt
  Datastore.Allocate Datastore.AllocateSpace Datastore.AllocateTemplate
  Datastore.Audit Sys.Audit Sys.Modify
  Mapping.Use Mapping.Modify Mapping.Audit
